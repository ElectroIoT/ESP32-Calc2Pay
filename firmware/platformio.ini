; Calc2Pay firmware — PlatformIO project
; Target: ESP32-S3-WROOM-1-N8R8 (8MB Quad Flash + 8MB Octal PSRAM)
; Bring-up board: generic ESP32-S3-DevKitC-1 (jumper-wired peripherals) until the
; custom PCB in ../hardware/ is fabricated. See ../hardware/03-GPIO-MAP.md for pins.

[env:calc2pay-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N8R8 module: octal PSRAM requires OPI PSRAM mode, quad flash stays QIO.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.f_flash = 80000000L
board_build.psram_type = opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Native USB CDC — matches the hardware's native-USB design (no USB-UART bridge).
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    zinggjm/GxEPD2 @ ^1.5.9
    ricmoo/QRCode @ ^0.0.1
    h2zero/NimBLE-Arduino @ ^1.4.1
    bblanchon/ArduinoJson @ ^7.0.4

; --- Bring-up board note ---
; A generic DevKitC-1 exposes a different physical pin *layout* than the custom
; PCB, but firmware always targets the LOGICAL GPIO numbers in
; ../hardware/03-GPIO-MAP.md — wire jumpers to match those GPIO numbers on
; whichever dev board you use, do not renumber pins in code to match the board.
